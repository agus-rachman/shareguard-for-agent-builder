name: Release

# Builds the package when a version tag is pushed (for example v0.1.0) and
# attaches it to a GitHub release. To also publish to PyPI, configure PyPI
# Trusted Publishing for this repository and uncomment the publish job.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Build
        run: python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

